syntax = "proto3";

// Frames as they travel a WebSocket between a bot and a client. It mirrors the
// frames.proto of the client SDKs: the package name, the message names and
// every field number match, so the wire format is compatible with any client
// built against them. Regenerate with:
//
//	go generate ./transport/wsserver/protobuf/internal/framepb
package pipecat;

option go_package = "github.com/gojargo/jargo/transport/wsserver/protobuf/internal/framepb;framepb";

message TextFrame {
  uint64 id = 1;
  string name = 2;
  string text = 3;
}

message AudioRawFrame {
  uint64 id = 1;
  string name = 2;
  bytes audio = 3;
  uint32 sample_rate = 4;
  uint32 num_channels = 5;
  optional uint64 pts = 6;
}

message TranscriptionFrame {
  uint64 id = 1;
  string name = 2;
  string text = 3;
  string user_id = 4;
  string timestamp = 5;
}

message MessageFrame {
  string data = 1;
}

message InterruptionFrame {
  uint64 id = 1;
  string name = 2;
}

message Frame {
  oneof frame {
    TextFrame text = 1;
    AudioRawFrame audio = 2;
    TranscriptionFrame transcription = 3;
    MessageFrame message = 4;
    InterruptionFrame interruption = 5;
  }
}
