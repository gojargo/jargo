name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # GoReleaser creates the GitHub Release and uploads the built artifacts.
    permissions:
      contents: write
      id-token: write # OIDC token for keyless cosign signing
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # cosign, used by GoReleaser's signs step to keyless-sign the checksums.
      # Pinned to 2.4.x: cosign 2.5+ defaults to the new bundle format, which
      # deprecates --output-signature/--output-certificate and would stop
      # producing the .sig/.pem assets the Signed-Releases check looks for.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
