name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # GoReleaser creates the GitHub Release and uploads the built artifacts.
    permissions:
      contents: write
      id-token: write # OIDC token for keyless cosign signing
      attestations: write # build provenance for the released artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # cosign, used by GoReleaser's signs step to keyless-sign the checksums.
      # Pinned to 2.4.x: cosign 2.5+ defaults to the new bundle format, which
      # deprecates --output-signature/--output-certificate and would stop
      # producing the .sig/.pem assets the Signed-Releases check looks for.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v2.4.3"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Build provenance for every artifact the checksums file lists, which is
      # every archive in the release. It records which workflow, at which
      # commit, produced them, so a consumer can check an artifact came from
      # this repository rather than only that it was signed. Attestations live
      # in GitHub's attestation store, not in the release assets; see
      # SECURITY.md for how to verify one.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
