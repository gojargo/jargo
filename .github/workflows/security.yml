name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Runs the gitleaks binary directly via its image: the marketplace action
      # requires a paid licence for GitHub organisations. The image and its
      # flags live in the Makefile so the same scan can be run locally.
      - name: gitleaks
        run: make secrets

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          # Documented, path-scoped suppressions for base-image and unused-dep
          # findings that do not apply. See .trivyignore.yaml for the rationale.
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif
          # Report findings (in the Security tab) without failing the build yet;
          # tighten to "1" once the baseline is clean.
          exit-code: "0"
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: trivy.sarif

  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Plumber scans this repo's GitHub Actions pipelines for hardening gaps
      # (action pinning, overbroad permissions, curl|bash, risky triggers). It
      # uploads its SARIF to the Security tab itself (upload-sarif defaults true).
      - name: Plumber pipeline scan
        uses: getplumber/plumber@bede38d25e270af86c2cec5dadc75e0925eb319c # v0.4.44
        with:
          # Gate below the action's default of 100 so CI stays green while the
          # findings still surface in the Security tab. Raise it as the pipelines
          # are hardened (SHA-pin actions, protect branches, ...).
          threshold: "75"
          soft-fail: "true"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # govulncheck builds the packages to compute the reachable call graph;
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # Reports only vulnerabilities jargo's code actually reaches, so this gates
      # the build. Stdlib advisories are cleared by the latest 1.27.x toolchain
      # that setup-go resolves from go.mod. The govulncheck version is pinned in
      # the Makefile, which installs it and runs the scan.
      - run: make vuln

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go
      - uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: "/language:go"

  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Snyk open-source dependency scan. Needs the SNYK_TOKEN repo secret; like
      # Trivy it reports to the Security tab without failing the build yet, and
      # is skipped cleanly when the token (and thus the SARIF) is absent.
      - name: Snyk test
        continue-on-error: true
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif ./...
      - name: Upload results to the Security tab
        if: ${{ hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: snyk.sarif

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # TruffleHog scans the repository for leaked credentials, complementing the
      # regex-based gitleaks scan with live verification. It fails the build on a
      # verified (or plausible "unknown") secret.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --results=verified,unknown
