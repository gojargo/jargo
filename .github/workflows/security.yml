name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # Run the gitleaks binary directly via its image — the marketplace action
      # requires a paid licence for GitHub organisations.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            dir /repo --redact --no-banner --verbose

  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          # Documented, path-scoped suppressions for base-image and unused-dep
          # findings that do not apply. See .trivyignore.yaml for the rationale.
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif
          # Report findings (in the Security tab) without failing the build yet;
          # tighten to "1" once the baseline is clean.
          exit-code: "0"
      - name: Upload results to the Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: trivy.sarif

  plumber:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Plumber scans this repo's GitHub Actions pipelines for hardening gaps
      # (action pinning, overbroad permissions, curl|bash, risky triggers). It
      # uploads its SARIF to the Security tab itself (upload-sarif defaults true).
      - name: Plumber pipeline scan
        uses: getplumber/plumber@87ca135cc4566ba8e9065ea95b5d897232cdb208 # v0.4.16
        with:
          # Gate below the action's default of 100 so CI stays green while the
          # findings still surface in the Security tab. Raise it as the pipelines
          # are hardened (SHA-pin actions, protect branches, ...).
          threshold: "75"
          soft-fail: "true"

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # govulncheck builds the packages to compute the reachable call graph;
      # jargo links libsoxr through cgo, so the dev headers must be present.
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.5.0
      # Reports only vulnerabilities jargo's code actually reaches, so this gates
      # the build. Stdlib advisories are cleared by the latest 1.26.x toolchain
      # that setup-go resolves from go.mod.
      - run: govulncheck ./...

  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # CodeQL's autobuild compiles the module; cgo needs the libsoxr headers.
      - run: sudo apt-get update && sudo apt-get install -y libsoxr-dev
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: github/codeql-action/init@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          languages: go
      - uses: github/codeql-action/autobuild@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
      - uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          category: "/language:go"

  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Snyk open-source dependency scan. Needs the SNYK_TOKEN repo secret; like
      # Trivy it reports to the Security tab without failing the build yet, and
      # is skipped cleanly when the token (and thus the SARIF) is absent.
      - name: Snyk test
        continue-on-error: true
        uses: snyk/actions/golang@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif ./...
      - name: Upload results to the Security tab
        if: ${{ hashFiles('snyk.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: snyk.sarif

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # TruffleHog scans the repository for leaked credentials, complementing the
      # regex-based gitleaks scan with live verification. It fails the build on a
      # verified (or plausible "unknown") secret.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6f3c981e7b77f235fd2702dd74af25fc4b72bf11 # v3.96.0
        with:
          extra_args: --results=verified,unknown
