# Dependabot keeps dependencies current: Go modules, the GitHub Actions used in
# the workflows (it bumps SHA pins in place, preserving the version comment), and
# the Docker base images (it bumps the pinned digests). Updates are grouped to
# keep the pull-request volume low.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # The benchmark suite is a module of its own, with its own go.mod.
  - package-ecosystem: gomod
    directory: /benchmarks
    schedule:
      interval: weekly
    groups:
      benchmarks-go-modules:
        patterns: ["*"]

  # Each network bus is a module of its own, with its own go.mod.
  - package-ecosystem: gomod
    directory: /bus/network/redis
    schedule:
      interval: weekly
    groups:
      redis-bus-go-modules:
        patterns: ["*"]

  # The Python side of the comparison: requirements.txt is compiled from
  # requirements.in by pip-compile with hashes, which Dependabot regenerates.
  - package-ecosystem: pip
    directory: /benchmarks/pipecat
    schedule:
      interval: weekly
    groups:
      benchmarks-python:
        patterns: ["*"]

  # The two comparison images' base images, pinned by digest.
  - package-ecosystem: docker
    directories:
      - /benchmarks
      - /benchmarks/pipecat
    schedule:
      interval: weekly
