# jargo is primarily a library; goreleaser ships the runnable example bots as
# release artifacts. See https://goreleaser.com.
version: 2

project_name: jargo

before:
  hooks:
    - go mod tidy

# The examples link no C library, so they build with cgo off. They are not
# static: purego reaches dlopen through libc, and libonnxruntime is loaded at
# run time, so the recommended way to run them is the container image, which
# carries both. Releases build a single linux/amd64 binary; now that nothing
# needs cgo, adding other platforms is a matter of listing them here.
builds:
  - id: echo
    main: ./examples/echo
    binary: jargo-echo
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w
  - id: voicebot
    main: ./examples/voicebot
    binary: jargo-voicebot
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64]
    ldflags:
      - -s -w

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Sign the checksums file with cosign keyless (Sigstore/OIDC in CI), which
# transitively covers every release artifact. Produces checksums.txt.sig and
# checksums.txt.pem release assets, satisfying OSSF Scorecard's Signed-Releases
# check. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem \
#     --signature checksums.txt.sig checksums.txt
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
