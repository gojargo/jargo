syntax = "proto3";

// Audio encodings shared by the NVIDIA Riva speech services. It mirrors the
// upstream riva_audio.proto: the package name and every enum value match, so
// the wire format is compatible with any Riva/NIM server. Regenerate with:
//
//	go generate ./provider/nvidia/internal/rivapb
package nvidia.riva;

option go_package = "github.com/gojargo/jargo/provider/nvidia/internal/rivapb;rivapb";

// AudioEncoding of the raw audio bytes in the enclosing message.
enum AudioEncoding {
  ENCODING_UNSPECIFIED = 0;
  LINEAR_PCM = 1;
  FLAC = 2;
  MULAW = 3;
  OGGOPUS = 4;
  ALAW = 20;
}
