# Release evals manifest: which scenarios each example bot runs.
# Run from the repository root with:
#
#   go run ./cmd/jargo eval suite evals/release/manifest.yaml
#
# Scenarios are reusable, so one shared scenario covers many bots. A scenario is
# scripted (a `turns:` list, in scenarios/scripted/) or a simulation (a
# `persona:`, an autonomous caller, in scenarios/simulated/); the judge and
# user blocks they `!include` sit beside the two folders. An entry names its
# folder and file, without the extension.
#
# A bot is an example's package directory under bots_dir. The suite builds each
# one once and starts it for every run on its own port.

bots_dir: ../../examples       # bot paths below are relative to this
scenarios_dir: scenarios       # scenario names resolve to <dir>/<name>.yaml
concurrency: 4
runs_dir: test-runs            # logs + recordings -> test-runs/<timestamp>/
record: true                   # record conversation audio (or pass -a)
spawn: "{bot} --port {port}"

suite:
